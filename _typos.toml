# typos: https://github.com/crate-ci/typos
[files]
extend-exclude = [
    "*.spv",
    "*.png",
    "*.jar",
    "Cargo.lock",
    "platform/android/gradlew",
    "platform/android/gradlew.bat",
    # Translations: French and Japanese, not English with typos.
    "crates/koebi-i18n/locales/*.po",
]

[default.extend-words]
# PNG "Paeth" row filter.
paeth = "paeth"
# Apple simulator/device identifier.
udid = "udid"
# Vulkan "level of detail" (sampler `min_lod`/`max_lod`).
lod = "lod"
# TrueType "index to location" table.
loca = "loca"
# Win32 flags of `TrackMouseEvent` (`TME_LEAVE`).
tme = "tme"
# French key names in the translation guide (docs/development/translation.md).
espace = "espace"

[default.extend-identifiers]
PNGs = "PNGs"
