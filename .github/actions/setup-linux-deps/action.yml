name: Install Linux build dependencies
description: >
  Headers SDL3 needs to build its X11, Wayland, audio and input backends from source, plus an
  X virtual framebuffer for windowed end-to-end tests.

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build pkg-config \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libxkbcommon-dev \
          libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
          xvfb xauth
