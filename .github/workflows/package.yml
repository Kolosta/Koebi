name: Package

# Reusable workflow: release builds of every platform, uploaded as artifacts named `koebi-*`.
# Called by CI (pushes to develop/main), Nightly and Release.
on:
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the artifacts.
        type: number
        default: 14

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# bash -eo pipefail, plus an error annotation with the relevant output when a step fails.
defaults:
  run:
    shell: bash .github/scripts/ci-step.sh {0}

jobs:
  desktop:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            args: --target x86_64-pc-windows-msvc
            artifact: target/dist/*.zip
            targets: ""
          - name: Linux
            os: ubuntu-24.04
            args: --target x86_64-unknown-linux-gnu
            artifact: target/dist/*.tar.gz
            targets: ""
          - name: macOS
            os: macos-26
            args: --universal
            artifact: target/dist/*.zip
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-vulkan
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.targets }}
          cache-key: package
      - run: cargo xtask package ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koebi-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  android:
    name: Package (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-linux-android,x86_64-linux-android
          cache-key: package-android
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk
      - name: Select the Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # Without the KOEBI_ANDROID_* signing secrets, the release APK is signed with the debug
      # key (installable for testing, not publishable on Google Play).
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KOEBI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KOEBI_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::no release keystore secret: the APK is signed with the debug key"
          fi
      - run: cargo xtask android --release
        env:
          KOEBI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOEBI_ANDROID_KEYSTORE_PASSWORD }}
          KOEBI_ANDROID_KEY_ALIAS: ${{ secrets.KOEBI_ANDROID_KEY_ALIAS }}
          KOEBI_ANDROID_KEY_PASSWORD: ${{ secrets.KOEBI_ANDROID_KEY_PASSWORD }}
      - run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir -p target/dist
          cp platform/android/app/build/outputs/apk/release/*.apk "target/dist/koebi-$version-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koebi-Android
          path: target/dist/*.apk
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  ios:
    name: Package (iOS)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moltenvk
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-apple-ios,aarch64-apple-ios-sim
          cache-key: package-ios
      - run: cargo xtask ios --release
      - run: cargo xtask ios --release --device
      # Device builds are ad-hoc signed: re-sign with a distribution identity to install them.
      - run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir -p target/dist
          ditto -c -k --keepParent target/aarch64-apple-ios-sim/release/Koebi.app "target/dist/koebi-$version-ios-simulator.zip"
          ditto -c -k --keepParent target/aarch64-apple-ios/release/Koebi.app "target/dist/koebi-$version-ios-device-unsigned.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koebi-iOS
          path: target/dist/*.zip
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
