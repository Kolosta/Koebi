name: PR policy

# Gitflow, commit and release conventions for pull requests. Required status check:
# "PR policy result".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # On main only the aggregated result runs. The release back-merge pull request (main into
  # develop) is opened with GITHUB_TOKEN, which triggers no workflow: it finds its required
  # "PR policy result" check on main's commit instead.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# bash -eo pipefail, plus an error annotation with the relevant output when a step fails.
# Jobs without a checkout override this with plain bash.
defaults:
  run:
    shell: bash .github/scripts/ci-step.sh {0}

jobs:
  gitflow:
    name: Gitflow branch rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: xtask
      # Branch names come from the PR author: pass them through the environment, never
      # interpolate them into the script.
      - run: cargo xtask gitflow-check --head "$HEAD_REF" --base "$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}

  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # Squash merges use the PR title as the commit message on develop.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and not end with a period.

  release:
    name: Release version
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the check compares with the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: xtask
      - run: cargo xtask release-check --head "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

  policy-result:
    name: PR policy result
    if: always()
    needs: [gitflow, title, release]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
