# Tests may unwrap/expect/panic/print freely; library code may not (see workspace lints).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false
doc-valid-idents = [
    "Vulkan",
    "MoltenVK",
    "LunarG",
    "SPIR-V",
    "SDL3",
    "OKLab",
    "OKLCH",
    "sRGB",
    "GitHub",
    "iOS",
    "macOS",
    "RenderDoc",
    "WCAG",
    "..",
]
# Components read the pointer through `Ui`, in the units of the space they lie in (ADR 0030):
# `Input` keeps window units, for the interface's core and the application's event glue.
disallowed-methods = [
    { path = "koebi_ui::Input::pointer", reason = "read the pointer through `Ui::pointer`, in local units (ADR 0030)" },
    { path = "koebi_ui::Input::pressed_at", reason = "read presses through `Ui::press_position`, in local units (ADR 0030)" },
    { path = "koebi_ui::Input::button_pressed_at", reason = "read presses through `Ui::button_press_position`, in local units (ADR 0030)" },
    { path = "koebi_ui::Input::motion", reason = "read motion through `Ui::pointer_delta`, in local units (ADR 0030)" },
]
